services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ORIGIN: ${ORIGIN:?Required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Required}
      DATABASE_URL: postgres://root:${POSTGRES_PASSWORD}@db:5432/local
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: